name: test

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install jj 0.42.0
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -LsSf https://github.com/jj-vcs/jj/releases/download/v0.42.0/jj-v0.42.0-x86_64-unknown-linux-musl.tar.gz \
            | tar -xzf - -C "$HOME/.local/bin" ./jj
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: npm test

  # Production changes only arrive through a dev → main release PR.
  main-from-dev:
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref != 'dev' }}
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "::error::main only accepts PRs from dev (got ${{ github.head_ref }})"; exit 1'
