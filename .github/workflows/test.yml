name: test

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Install jj 0.42.0
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -LsSf https://github.com/jj-vcs/jj/releases/download/v0.42.0/jj-v0.42.0-x86_64-unknown-linux-musl.tar.gz \
            | tar -xzf - -C "$HOME/.local/bin" ./jj
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: npm test

  # Production changes only arrive through a dev → main release PR.
  main-from-dev:
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref != 'dev' }}
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "::error::main only accepts PRs from dev (got ${{ github.head_ref }})"; exit 1'
